# 커밋 하나로 GKE·EKS에 같은 버전을 배포한다 (클라우드별 차이는 overlay에만)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payflow
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - cluster: gke
            overlay: gke
          - cluster: in-cluster
            overlay: eks
  template:
    metadata:
      name: "payflow-{{.overlay}}"
      labels:
        payflow.io/cloud: "{{.overlay}}"
    spec:
      project: payflow
      source:
        repoURL: https://github.com/qorgh529/nova-final.git
        targetRevision: main
        path: "deploy/overlays/{{.overlay}}"
      destination:
        name: "{{.cluster}}"
        namespace: payflow
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
