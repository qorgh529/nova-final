apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      payflow.io/cloud: aws

images:
  - name: payflow/auth
    newName: AWS_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/payflow/auth
    newTag: 0.1.0
  - name: payflow/payment
    newName: AWS_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/payflow/payment
    newTag: 0.1.0
  - name: payflow/order
    newName: AWS_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/payflow/order
    newTag: 0.1.0

configMapGenerator:
  - name: payflow-config
    namespace: payflow
    literals:
      - CLOUD=aws
      # 평시 standby(읽기 전용, RDS는 복제본). RDS 승격 후 Git 커밋으로 primary 전환
      - APP_MODE=standby
      # terraform output rds_endpoint
      - DB_HOST=RDS_ENDPOINT
      - DB_NAME=payflow

patches:
  - path: ingress.yaml
  # Warm Standby: 평시 최소 1개, 장애 시 HPA로 확장
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
