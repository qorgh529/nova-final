apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order
                port:
                  name: http
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment
                port:
                  name: http
          # Route 53 헬스체크 대상 (결제 서비스가 살아 있어야 Primary 정상으로 판단)
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: payment
                port:
                  name: http
