spring:
  application:
    name: nova-approval-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nova}
    username: ${DB_USER:nova}
    password: ${DB_PASSWORD:nova}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# 앱 자체 로그인(JWT). 서명 키는 시크릿 저장소/환경변수에서 주입한다. Google SSO를 쓰지 않는다.
nova:
  jwt:
    # HS256 대칭 키 (Base64 아님, 최소 32바이트). 운영에서는 반드시 주입한다.
    secret: ${NOVA_JWT_SECRET:dev-only-insecure-secret-change-me-32bytes!!}
    issuer: ${NOVA_JWT_ISSUER:nova-approval}
    ttl-seconds: ${NOVA_JWT_TTL_SECONDS:3600}
  storage:
    # s3 | gcs  (로컬/AWS는 s3, MinIO도 s3 호환)
    driver: ${STORAGE_DRIVER:s3}
    bucket: ${STORAGE_BUCKET:nova-attachments}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${AWS_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      path-style: ${S3_PATH_STYLE:true}
  runtime:
    # /version에 노출. 배포 매니페스트에서 주입한다.
    cloud: ${RUNTIME_CLOUD:local}
    image-digest: ${IMAGE_DIGEST:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      mode: full

info:
  app:
    name: nova-approval-api
