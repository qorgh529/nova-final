name: deploy

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: "5.8.0"
      KUBECONFORM_VERSION: "0.7.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform

      - name: Validate overlays
        run: |
          for o in gke eks; do
            echo "::group::$o"
            kustomize build "deploy/overlays/$o" | kubeconform -strict -summary
            echo "::endgroup::"
          done

      - name: Validate ArgoCD apps
        run: |
          kustomize build deploy/argocd/apps | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
